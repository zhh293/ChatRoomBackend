map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream chatroom_http {
    zone chatroom_http 64k;
    server app:8080 resolve;
    keepalive 16;
}

upstream chatroom_ws {
    zone chatroom_ws 64k;
    server app:9090 resolve;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://chatroom_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://chatroom_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /files/ {
        alias /data/chatroom-storage/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
    }

    location / {
        default_type application/json;
        return 404 '{"code":404,"msg":"not found"}';
    }
}
