spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/chatroom?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ShardingSphere 分表配置（开发环境）
  shardingsphere:
    datasource:
      names: ds0
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://127.0.0.1:3306/chatroom?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
        username: root
        password: root
    rules:
      sharding:
        tables:
          chat_message:
            actual-data-nodes: ds0.chat_message_$->{0..15}
            table-strategy:
              standard:
                sharding-column: session_id
                sharding-algorithm-name: chat-message-mod
        sharding-algorithms:
          chat-message-mod:
            type: MOD
            props:
              sharding-count: 16
    props:
      sql-show: true

  # Redis 配置（开发环境单机）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # ============================================================
  # 【Redis Cluster 预留 - 开发环境】启用时：
  #   1. 注释掉上方 host/port/database 单机配置
  #   2. 取消下方注释
  #   3. 同步取消 pom.xml commons-pool2、RedisClusterConfig.java 的注释
  # ============================================================
  # data:
  #   redis:
  #     password:                          # Cluster 无密码时留空
  #     cluster:
  #       # 本地开发可用 docker-compose 起 6 节点 Cluster（3主3从）
  #       nodes:
  #         - 127.0.0.1:7001
  #         - 127.0.0.1:7002
  #         - 127.0.0.1:7003
  #         - 127.0.0.1:7004
  #         - 127.0.0.1:7005
  #         - 127.0.0.1:7006
  #       max-redirects: 3                 # 最大重定向次数（MOVED/ASK）
  #     lettuce:
  #       pool:
  #         max-active: 20
  #         max-idle: 10
  #         min-idle: 5
  #         max-wait: 1000ms
  #       cluster:
  #         refresh:
  #           adaptive: true               # 自适应拓扑刷新：节点故障时自动感知
  #           period: 30s                  # 定期刷新间隔
  # ============================================================
  # 【Redis Cluster 预留 END】
  # ============================================================

  # RabbitMQ 配置
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated   # Publisher Confirm
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 20
        prefetch: 10

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.chatroom.module.*.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"
